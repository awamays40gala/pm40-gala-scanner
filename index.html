<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>PM40 Gala Check In</title>

  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      text-align: center;
    }

    .container {
      max-width: 600px;
      margin: auto;
      padding: 20px;
    }

    h1 {
      margin-bottom: 5px;
    }

    .subtitle {
      margin-top: 0;
      color: #bbb;
      line-height: 1.4;
    }

    #reader {
      width: 100%;
      max-width: 500px;
      margin: 25px auto;
      background: white;
      border-radius: 12px;
      overflow: hidden;
    }

    .result {
      display: none;
      padding: 25px;
      border-radius: 15px;
      margin-top: 20px;
    }

    .valid {
      background: #087f23;
    }

    .already {
      background: #b36b00;
    }

    .invalid {
      background: #a50000;
    }

    .error {
      background: #555;
    }

    .result h2 {
      margin-top: 0;
      font-size: 32px;
    }

    .ticket-id {
      font-size: 25px;
      font-weight: bold;
      margin: 15px 0;
    }

    .type {
      font-size: 22px;
      font-weight: bold;
    }

    .time {
      font-size: 20px;
      margin-top: 10px;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 15px 25px;
      font-size: 18px;
      cursor: pointer;
      margin-top: 15px;
    }

    #startButton {
      background: white;
      color: black;
    }

    #statusMessage {
      margin-top: 15px;
      color: #bbb;
      font-size: 15px;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>PM40 Gala Check In</h1>

    <p class="subtitle">
      Pastor A. W. Anthony Mays<br>
      40th Pastoral Anniversary Gala
    </p>

    <button id="startButton" onclick="startScanner()">
      START SCANNER
    </button>

    <div id="statusMessage">
      Ready to scan
    </div>

    <div id="reader"></div>

    <div id="result" class="result">

      <h2 id="resultTitle"></h2>

      <div id="ticketId" class="ticket-id"></div>

      <div id="ticketType" class="type"></div>

      <div id="checkInTime" class="time"></div>

    </div>

  </div>

<script>

const API_URL =
"https://script.google.com/macros/s/AKfycbxfMpjkcZ1J9MPm0pfNI48P7Uji3ryVx_SM2IBQT7Tw8849lnFSG7tUqKQiuyI-k_s/exec";

let scanner = null;
let scanning = false;
let resetTimer = null;


/*
====================================================
START SCANNER
====================================================
*/

function startScanner() {

  if (scanning) {
    return;
  }

  clearTimeout(resetTimer);

  document.getElementById("result").style.display = "none";

  document.getElementById("statusMessage").textContent =
    "Camera ready. Scan ticket.";

  scanner = new Html5Qrcode("reader");

  scanner.start(

    {
      facingMode: "environment"
    },

    {
      fps: 10,

      qrbox: {
        width: 250,
        height: 250
      }
    },

    onScanSuccess,

    onScanFailure

  ).then(() => {

    scanning = true;

    document.getElementById("startButton").style.display = "none";

    document.getElementById("statusMessage").textContent =
      "Ready to scan";

  }).catch(error => {

    showError(
      "CAMERA ERROR",
      "Unable to access the camera. Make sure camera permission is allowed."
    );

    console.error(error);

  });
}


/*
====================================================
NORMAL FAILED SCANS
====================================================
*/

function onScanFailure(error) {
  // Normal failed scans are ignored.
}


/*
====================================================
SUCCESSFUL QR SCAN
====================================================
*/

async function onScanSuccess(decodedText) {

  if (!scanning) {
    return;
  }

  scanning = false;

  try {

    await scanner.stop();

  } catch (error) {

    console.log("Scanner stop:", error);

  }

  const ticketId =
    decodedText.trim().toUpperCase();

  document.getElementById("statusMessage").textContent =
    "Checking ticket...";

  checkTicket(ticketId);
}


/*
====================================================
SEND TICKET TO GOOGLE
====================================================
*/

async function checkTicket(ticketId) {

  try {

    const response = await fetch(
      API_URL +
      "?ticket=" +
      encodeURIComponent(ticketId)
    );

    if (!response.ok) {
      throw new Error("Server returned an error.");
    }

    const data = await response.json();

    showResult(data);

  } catch (error) {

    console.error(error);

    showError(
      "CONNECTION ERROR",
      "Unable to connect to the gala ticket system."
    );

  }
}


/*
====================================================
DISPLAY RESULT
====================================================
*/

function showResult(data) {

  const result =
    document.getElementById("result");

  const title =
    document.getElementById("resultTitle");

  const ticketId =
    document.getElementById("ticketId");

  const ticketType =
    document.getElementById("ticketType");

  const time =
    document.getElementById("checkInTime");

  result.className = "result";

  ticketId.textContent =
    data.ticketId || "";

  ticketType.textContent =
    data.type
      ? data.type.toUpperCase()
      : "";


  /*
  VALID TICKET
  */

  if (data.status === "CHECKED_IN") {

    result.classList.add("valid");

    title.textContent =
      "VALID TICKET";

    time.textContent =
      "CHECKED IN • " +
      formatTime(data.checkInTime);

  }


  /*
  ALREADY CHECKED IN
  */

  else if (data.status === "ALREADY_CHECKED_IN") {

    result.classList.add("already");

    title.textContent =
      "ALREADY CHECKED IN";

    time.textContent =
      "FIRST SCANNED • " +
      formatTime(data.checkInTime);

  }


  /*
  INVALID TICKET
  */

  else if (data.status === "NOT_FOUND") {

    result.classList.add("invalid");

    title.textContent =
      "INVALID TICKET";

    time.textContent =
      "Ticket not found.";

  }


  /*
  OTHER ERROR
  */

  else {

    result.classList.add("error");

    title.textContent =
      "SYSTEM ERROR";

    time.textContent =
      data.message ||
      "Unable to process ticket.";

  }


  result.style.display =
    "block";


  /*
  AUTOMATICALLY RETURN
  TO SCANNING AFTER 3 SECONDS
  */

  resetTimer =
    setTimeout(() => {

      resetScanner();

    }, 3000);

}


/*
====================================================
ERROR DISPLAY
====================================================
*/

function showError(titleText, message) {

  const result =
    document.getElementById("result");

  result.className =
    "result error";

  document.getElementById("resultTitle")
    .textContent = titleText;

  document.getElementById("ticketId")
    .textContent = "";

  document.getElementById("ticketType")
    .textContent = "";

  document.getElementById("checkInTime")
    .textContent = message;

  result.style.display =
    "block";


  resetTimer =
    setTimeout(() => {

      resetScanner();

    }, 3000);

}


/*
====================================================
FORMAT CHECK IN TIME
====================================================
*/

function formatTime(timestamp) {

  if (!timestamp) {
    return "";
  }

  const date =
    new Date(timestamp);

  if (isNaN(date.getTime())) {
    return timestamp;
  }

  return date.toLocaleTimeString([], {

    hour: "numeric",

    minute: "2-digit",

    second: "2-digit"

  });

}


/*
====================================================
RESET AND SCAN NEXT TICKET
====================================================
*/

function resetScanner() {

  clearTimeout(resetTimer);

  document.getElementById("result")
    .style.display = "none";

  document.getElementById("statusMessage")
    .textContent =
    "Ready for next ticket.";

  startScanner();

}

</script>

</body>
</html>
