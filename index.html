<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>PM40 Gala Check In</title>

  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      text-align: center;
    }

    .container {
      max-width: 600px;
      margin: auto;
      padding: 20px;
    }

    h1 {
      margin-bottom: 5px;
    }

    .subtitle {
      margin-top: 0;
      color: #bbb;
    }

    #reader {
      width: 100%;
      max-width: 500px;
      margin: 25px auto;
      background: white;
      border-radius: 12px;
      overflow: hidden;
    }

    .result {
      display: none;
      padding: 25px;
      border-radius: 15px;
      margin-top: 20px;
    }

    .valid {
      background: #087f23;
    }

    .already {
      background: #b36b00;
    }

    .invalid {
      background: #a50000;
    }

    .error {
      background: #555;
    }

    .result h2 {
      margin-top: 0;
      font-size: 32px;
    }

    .ticket-id {
      font-size: 25px;
      font-weight: bold;
      margin: 15px 0;
    }

    .type {
      font-size: 22px;
      font-weight: bold;
    }

    .time {
      font-size: 20px;
      margin-top: 10px;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 15px 25px;
      font-size: 18px;
      cursor: pointer;
      margin-top: 15px;
    }

    #startButton {
      background: white;
      color: black;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>PM40 Gala Check In</h1>

    <p class="subtitle">
      Pastor A. W. Anthony Mays 40th Pastoral Anniversary Gala
    </p>

    <button id="startButton" onclick="startScanner()">
      START SCANNER
    </button>

    <div id="reader"></div>

    <div id="result" class="result">
      <h2 id="resultTitle"></h2>

      <div id="ticketId" class="ticket-id"></div>

      <div id="ticketType" class="type"></div>

      <div id="checkInTime" class="time"></div>

      <button onclick="resetScanner()">
        SCAN NEXT TICKET
      </button>
    </div>

  </div>

<script>

const API_URL =
"https://script.google.com/macros/s/AKfycbxfMpjkcZ1J9MPm0pfNI48P7Uji3ryVx_SM2IBQT7Tw8849lnFSG7tUqKQiuyI-k_s/exec";

let scanner = null;
let scanning = false;

function startScanner() {

  if (scanning) {
    return;
  }

  document.getElementById("result").style.display = "none";

  scanner = new Html5Qrcode("reader");

  scanner.start(
    { facingMode: "environment" },

    {
      fps: 10,
      qrbox: {
        width: 250,
        height: 250
      }
    },

    onScanSuccess,

    onScanFailure

  ).then(() => {

    scanning = true;

    document.getElementById("startButton").style.display = "none";

  }).catch(error => {

    showError(
      "CAMERA ERROR",
      "Unable to access the camera. Please make sure camera permission is allowed."
    );

    console.error(error);

  });
}


function onScanFailure(error) {
  // Ignore normal failed scans.
}


async function onScanSuccess(decodedText) {

  if (!scanning) {
    return;
  }

  scanning = false;

  try {

    await scanner.stop();

  } catch (error) {

    console.log("Scanner stop:", error);

  }

  const ticketId = decodedText.trim().toUpperCase();

  checkTicket(ticketId);
}


async function checkTicket(ticketId) {

  try {

    const response = await fetch(
      API_URL + "?ticket=" + encodeURIComponent(ticketId)
    );

    if (!response.ok) {
      throw new Error("Server returned an error.");
    }

    const data = await response.json();

    showResult(data);

  } catch (error) {

    console.error(error);

    showError(
      "CONNECTION ERROR",
      "Unable to connect to the gala ticket system."
    );

  }
}


function showResult(data) {

  const result = document.getElementById("result");
  const title = document.getElementById("resultTitle");
  const ticketId = document.getElementById("ticketId");
  const ticketType = document.getElementById("ticketType");
  const time = document.getElementById("checkInTime");

  result.className = "result";

  ticketId.textContent = data.ticketId || "";

  ticketType.textContent =
    data.type ? data.type.toUpperCase() : "";

  if (data.status === "CHECKED_IN") {

    result.classList.add("valid");

    title.textContent = "VALID TICKET";

    time.textContent =
      "CHECKED IN • " + formatTime(data.checkInTime);

  }

  else if (data.status === "ALREADY_CHECKED_IN") {

    result.classList.add("already");

    title.textContent = "ALREADY CHECKED IN";

    time.textContent =
      "First scanned • " + formatTime(data.checkInTime);

  }

  else if (data.status === "NOT_FOUND") {

    result.classList.add("invalid");

    title.textContent = "INVALID TICKET";

    time.textContent = "Ticket not found.";

  }

  else {

    result.classList.add("error");

    title.textContent = "SYSTEM ERROR";

    time.textContent =
      data.message || "Unable to process ticket.";

  }

  result.style.display = "block";
}


function showError(titleText, message) {

  const result = document.getElementById("result");

  result.className = "result error";

  document.getElementById("resultTitle").textContent = titleText;

  document.getElementById("ticketId").textContent = "";

  document.getElementById("ticketType").textContent = "";

  document.getElementById("checkInTime").textContent = message;

  result.style.display = "block";
}


function formatTime(timestamp) {

  if (!timestamp) {
    return "";
  }

  const date = new Date(timestamp);

  if (isNaN(date.getTime())) {
    return timestamp;
  }

  return date.toLocaleTimeString([], {
    hour: "numeric",
    minute: "2-digit",
    second: "2-digit"
  });
}


function resetScanner() {

  document.getElementById("result").style.display = "none";

  document.getElementById("startButton").style.display = "block";

  startScanner();
}

</script>

</body>
</html>
